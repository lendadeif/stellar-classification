<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Classification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-image: url("https://i.pinimg.com/736x/df/89/92/df8992acb1f14234abc55ebfa51d27a4.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        overflow: hidden; 
      }
      h1 {
        color: #fff;
        text-align: center;
        margin: 10px 0; 
        font-size: 2.5rem; 
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7), 0 0 15px #6a0dad;
      }
      form {
        background: linear-gradient(135deg, #1a1a40, #4b0082);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        width: 90%; 
        max-width: 600px; 
        height: 80%; 
        overflow-y: auto; 
        color: #fff;
      }

      form::-webkit-scrollbar {
        width: 10px; 
      }

      form::-webkit-scrollbar-track {
        background: #1a1a40; 
        border-radius: 10px;
      }

      form::-webkit-scrollbar-thumb {
        background: #6a0dad; 
        border-radius: 10px; 
        border: 2px solid #1a1a40; 
      }

      form::-webkit-scrollbar-thumb:hover {
        background: #8a2be2;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: bold;
        color: #e0e0ff;
        text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
      }
      input[type="number"] {
        width: calc(100% - 22px);
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #6a0dad;
        background-color: #2c2c54;
        color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      input[type="submit"] {
        background: linear-gradient(135deg, #6a0dad, #8a2be2);
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: transform 0.2s, background 0.3s;
      }
      input[type="submit"]:hover {
        background: linear-gradient(135deg, #8a2be2, #b19cd9);
        transform: scale(1.05);
      }

      /* Modal styles */
      .modal {
        display: none; /* Hidden by default */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.8); 
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        position: relative;
        background: linear-gradient(135deg, #1a1a40, #4b0082);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        text-align: center;
        color: white;
        max-width: 500px;
        width: 90%;
      }

      .modal-content img {
        max-width: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      .close {
        position: absolute;
        top: 10px;
        right: 15px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
      }

      .close:hover {
        color: #ff4d4d;
      }
    </style>
  </head>
  <body>
    <h1>Stellar Classification</h1>
    <form
      id="form"
      action="/predict"
      method="post"
      enctype="multipart/form-data"
    >
      <label>Alpha: <input type="number" name="alpha" /></label><br />
      <label>Delta: <input type="number" name="delta" /></label><br />
      <label>Ultra Violet: <input type="number" name="u" /></label><br />
      <label>Green Filter: <input type="number" name="g" /></label><br />
      <label>Red Filter: <input type="number" name="r" /></label><br />
      <label>Near Infrared: <input type="number" name="i" /></label><br />
      <label>Infrared: <input type="number" name="z" /></label><br />
      <label>Red shift : <input type="number" name="redshift" /></label><br />
      <label>Plate : <input type="number" name="plate" /></label>
      <!-- <br /> -->
      <!-- <label>Modified Julian Date : <input type="number" name="mjd" /></label> -->
      <!-- ><br />     --> 
      <!-- <label>Fiber ID : <input type="number" name="fiberID" /></label><br /> -->
    </form>
    <div style="margin-top: 10px">
      <input
        type="submit"
        form="form"
        value="Predict"
        style="
          background: linear-gradient(135deg, #6a0dad, #8a2be2);
          color: white;
          padding: 12px 20px;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-size: 18px;
          font-weight: bold;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
          transition: transform 0.2s, background 0.3s;
        "
      />
    </div>
    {% if prediction_text %}
    <h2>Prediction: {{ prediction_text }}</h2>
    {% endif %}
    <div id="predictionModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Prediction Result</h2>
        <img id="predictionImage" src="" alt="Predicted Class Image">
        <p id="predictionText"></p>
      </div>
    </div>
    <script>
      function showModal(imageSrc, predictionText) {
        // Set the image and text in the modal
        document.getElementById('predictionImage').src = imageSrc;
        document.getElementById('predictionText').innerText = predictionText;

        // Show the modal
        document.getElementById('predictionModal').style.display = 'flex';
      }

      function closeModal() {
        // Hide the modal
        document.getElementById('predictionModal').style.display = 'none';

        // Reset the modal content
        document.getElementById('predictionImage').src = '';
        document.getElementById('predictionText').innerText = '';
      }

      document
        .querySelector('input[type="submit"]')
        .addEventListener("click", function (event) {
          event.preventDefault(); 

          const formData = new FormData(document.getElementById("form"));

          fetch("/predict", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.error) {
                alert("Error: " + data.error);
              } else {
                showModal(data.image_file, data.prediction_text);
              }
            })
            .catch((error) => {
              console.error("Error:", error);
            });
        });
    </script>
  </body>
</html>
